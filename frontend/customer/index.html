<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>AI Operations Agent</title>
</head>

<body>
    <h1>AI Operations Agent</h1>
    <p>Ask about orders, inventory, and refund policies.</p>

    <div id="chat-box">
        <p>Assistant: How can I help you today?</p>
    </div>

    <form id="chat-form">
        <input
            id="message-input"
            type="text"
            placeholder="Type your question..."
            required
        >
        <button type="submit">Send</button>
    </form>

    <script src="script.js"></script>
</body>
</html>
