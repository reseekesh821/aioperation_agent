<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>AI Operations Agent</title>
</head>

<body>
    <h1>AI Operations Agent</h1>
    <p>Ask about orders, inventory, and refund policies.</p>

    <div id="chat-box">
        <p>Assistant: How can I help you today?</p>
    </div>

    <form id="chat-form">
        <input
            id="message-input"
            type="text"
            placeholder="Type your question..."
            required
        >
        <button type="submit">Send</button>
    </form>

    <section id="support-inbox" aria-labelledby="support-inbox-title">
        <h2 id="support-inbox-title">Customer Support Inbox</h2>
        <p class="support-inbox-help">
            Load up to five labeled Gmail messages from AI-Operations-Test.
        </p>
        <button id="load-emails-button" type="button">Load Emails</button>
        <div id="support-inbox-status" role="status" aria-live="polite"></div>
        <div id="support-email-list"></div>
    </section>

    <script src="script.js"></script>
</body>
</html>
