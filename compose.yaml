services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: aiops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: aiops
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - aiops_pgdata:/var/lib/postgresql
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiops -d aiops"]
      interval: 5s
      retries: 10

  backend:
    image: ai-ops-backend:latest
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql://aiops:${POSTGRES_PASSWORD}@db:5432/aiops
      OLLAMA_HOST: http://host.docker.internal:11434
    volumes:
      - ./data/chroma:/app/data/chroma
    depends_on:
      db:
        condition: service_healthy

volumes:
  aiops_pgdata:
    name: aiops_pgdata